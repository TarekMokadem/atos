name: CI

on:
  push:
    branches: [main, master, demo]
  pull_request:
    branches: [main, master, demo]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - name: Tests Maven (profil test, H2)
        working-directory: task-service
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: task-ui/package-lock.json
      - name: Install
        working-directory: task-ui
        run: npm ci --legacy-peer-deps
      - name: Tests unitaires
        working-directory: task-ui
        run: npm run test:ci
      - name: Build
        working-directory: task-ui
        run: npx ng build --configuration production
