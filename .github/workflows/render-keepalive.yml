# Réveille le backend Render (ex. free tier) via GET sur une URL publique.
#
# Échecs fréquents si --max-time trop court : cold start Spring peut dépasser 60–120 s,
# et le proxy Render renvoie 503 tant que l’instance n’est pas prête. D’où max-time +
# --retry-all-errors (pour 5xx) et plusieurs tentatives.
#
# Configuration (Settings → Secrets and variables → Actions) :
#   RENDER_KEEPALIVE_URL = URL complète, ex. https://VOTRE-SERVICE.onrender.com/actuator/health
#
# Horaires : pings 24h/24 depuis GitHub (évite la mise en veille Render entre minuit et 7h).
# Le front Angular garde sa plage silencieuse locale (pas de requêtes depuis le navigateur la nuit).
#
# Branche : les workflows `schedule` ne tournent que sur la branche PAR DÉFAUT du dépôt.
# Si ta branche par défaut est `main`, merge ce fichier sur `main` ou change la branche par défaut.
#
# GitHub peut espacer les runs d’un seul cron `* * * * *`. Cinq crons décalés (minutes % 5)
# couvrent chaque minute de l’heure tout en restant dans les limites habituelles des dépôts.
# Attention : ~1440 exécutions/jour consomment des minutes Actions (quota du compte).
# Pour une horloge stricte hors GitHub : cron-job.org, UptimeRobot, etc.

name: Render keep-alive

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET santé (timeouts compat cold start Render)
        env:
          KEEPALIVE_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
        run: |
          set -e
          if [ -z "${KEEPALIVE_URL:-}" ]; then
            echo "Secret RENDER_KEEPALIVE_URL absent — rien à appeler (configurez-le dans les secrets du dépôt)."
            exit 0
          fi
          # Nettoyer retours ligne / espaces (cause fréquente de curl: (3) Malformed URL)
          url="$(printf '%s' "$KEEPALIVE_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          url="${url#\"}"
          url="${url%\"}"
          url="${url#<}"
          url="${url%>}"
          if ! printf '%s' "$url" | grep -qE '^https?://[^[:space:]]+$'; then
            echo "RENDER_KEEPALIVE_URL invalide après nettoyage (attendu: https://... sans espace ni guillemets). Longueur=${#url}"
            exit 1
          fi
          echo "Ping keep-alive (longueur URL=${#url}, max 240s par tentative, retries sur 5xx)"
          curl -fsS \
            --connect-timeout 30 \
            --max-time 240 \
            --retry 5 \
            --retry-delay 20 \
            --retry-all-errors \
            -- "$url"
