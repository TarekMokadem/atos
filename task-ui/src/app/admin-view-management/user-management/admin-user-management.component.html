<div style="display: flex; justify-content: end">
  <button mat-raised-button class="add-entity" (click)="openDialog()">Ajouter</button>
</div>
<div class="m-20"></div>
<mat-card class="w-100">
  <mat-card-content>
<div class="mat-lg-8">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container *ngFor="let column of displayedColumns.slice(0,displayedColumns.length-1); let i = index">
      <ng-container matColumnDef="{{column}}">
        <th mat-header-cell *matHeaderCellDef mat-sort-header [ngClass]="column"> {{columnHeader[i]}} </th>
        <td mat-cell *matCellDef="let element">

          <textarea type="text"
                    *ngIf="element.editMode && column!='creationDate'"
                    [(ngModel)]="element[column]">
        </textarea>
          <span *ngIf="!element.editMode || column == 'creationDate' ">{{column == 'creationDate' ? (element[column] | date: 'dd/MM/yyyy') : element[column] }}</span></td>
      </ng-container>
    </ng-container>


    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
      <td mat-cell *matCellDef="let row">
        <div style="display:flex;">
          <button mat-fab aria-label="Example icon button with a delete icon" (click)="deleteUser(row.id)"
                  class="delete-icon" *ngIf="!row.editMode">
            <mat-icon>delete</mat-icon>
          </button>
          <button mat-fab aria-label="Example icon button with a delete icon" (click)="editBoolChange(row)"
                  class="delete-icon" *ngIf="row.editMode">
            <mat-icon>remove</mat-icon>
          </button>
          <div class="ps-8"></div>
          <button mat-fab aria-label="Example icon button with a delete icon" (click)="editBoolChange(row)"
                  class="edit-icon" *ngIf="!row.editMode">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-fab aria-label="Example icon button with a delete icon" (click)="editUser(row)"
                  class="confirm-icon" *ngIf="row.editMode">
            <mat-icon>check</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
<!--      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>-->
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
  </mat-card-content></mat-card>
