<h1 class="title">CONGÉS</h1>
<div class="d-flex">
  <mat-form-field>
    <mat-label>Jour de congé</mat-label>
    <mat-date-range-input [formGroup]="jourRange" [rangePicker]="jourPicker">
      <input matStartDate formControlName="start" placeholder="Start date">
      <input matEndDate formControlName="end" (dateChange)="applyFilters()" placeholder="End date">
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="jourPicker"></mat-datepicker-toggle>
    <mat-date-range-picker #jourPicker></mat-date-range-picker>
  </mat-form-field>
  <div class="ps-32"></div>
  <mat-form-field>
    <mat-label>Raison de congé</mat-label>
    <input matInput [formControl]="raisonForm" (keyup)="applyFilters()" placeholder="Ex. Mia" #input>
  </mat-form-field>
  <div class="ps-32"></div>
  <mat-form-field>
    <mat-label>Statut</mat-label>
    <mat-select [formControl]="statutSelectForm" multiple>
      <mat-option (click)="applyFilters()" *ngFor="let statut of ['Accepté','Refusé','En Attente']"
                  [value]="statut">{{statut}}</mat-option>
    </mat-select>
  </mat-form-field>
  <div class="ps-32"></div>
  <mat-form-field>
    <mat-label>Date de demande</mat-label>
    <mat-date-range-input [formGroup]="dateRange" [rangePicker]="datePicker">
      <input matStartDate formControlName="start" placeholder="Start date">
      <input matEndDate formControlName="end" (dateChange)="applyFilters()" placeholder="End date">
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
    <mat-date-range-picker #datePicker></mat-date-range-picker>
  </mat-form-field>

</div>

<div style="display: flex; justify-content: space-between">
  <button mat-raised-button class="clear-filter" (click)="clearFilters()">Effacer</button>
  <button mat-raised-button class="add-entity" (click)="openDialog()">Ajouter</button>
</div>
<div class="m-20"></div>

<mat-card class="w-100">
  <mat-card-content>
    <div class="mat-lg-8">

      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container *ngFor="let column of displayedColumns.slice(0,displayedColumns.length-1); let i = index">
          <ng-container *ngIf="column != 'statut'" matColumnDef="{{column}}">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> {{columnHeader[i]}} </th>
            <td mat-cell *matCellDef="let element"> {{column == 'jour' || column == 'fin' || column == 'dateDemande' ? (element[column] | date: 'dd/MM/yyyy') : element[column] }} </td>
          </ng-container>
          <ng-container *ngIf="column == 'statut'" matColumnDef="statut">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Statut</th>
            <td mat-cell *matCellDef="let row">
              <p *ngIf="row.statut !== 'En Attente' " [ngClass]="{
                            'valide': row.statut === 'Accepté',
                            'attente': row.statut === 'En Attente',
                            'refus': row.statut === 'Refusé'
                          }">{{row.statut}}</p>
              <div *ngIf="row.statut === 'En Attente' " style="display: flex">
                <button mat-fab aria-label="Example icon button with a delete icon" class="valide-icon"
                        (click)="acceptLeave(row)">
                  <mat-icon>check</mat-icon>
                </button>
                <div class="ps-16"></div>
                <p style="font-size: xx-large;"> | </p>
                <div class="ps-16"></div>
                <button mat-fab aria-label="Example icon button with a delete icon" class="refus-icon"
                        (click)="denyLeave(row)">
                  <mat-icon>remove</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Action</th>
          <td mat-cell *matCellDef="let row">
            <div style="display:flex;">
              <button mat-fab aria-label="Example icon button with a delete icon" (click)="deleteLeave(row.id)"
                      class="delete-icon">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Sélectionner page"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
