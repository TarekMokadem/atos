<mat-toolbar color="primary">
  <img src="assets/images/atos_logo.png" width="10%">

  <!-- This fills the remaining space of the current row -->
  <span class="example-fill-remaining-space"></span>

  <mat-toolbar class="header ps-24 pe-24">
    <button type="button" class="ms-4" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()"
            >
      <i-feather name="menu" class="feather-base mt-n3"></i-feather>
    </button>
    <div class="ms-auto">
      <button mat-button class="fs-16 pt-4 pb-4 ps-8 pe-8 text-light-muted d-flex align-items-center" [matMenuTriggerFor]="menu">
        <div class="d-flex align-items-center">
          <span class="fw-bold ms-8">Admin panel de {{currentUser.sub}}</span>
          <span class="fw-light ms-8 "></span>
          <i-feather name="chevron-down" class="feather-base"></i-feather>
        </div>
      </button>
      <mat-menu #menu="matMenu" class="profile-dropdown">
       <!-- <div class="p-16 mb-4">
          <button mat-menu-item class="fs-16">Edit Profile</button>
          <button mat-menu-item class="fs-16">Account</button>
          <button mat-menu-item class="fs-16">Change Password</button>
          <button mat-menu-item class="fs-16">My Settings</button>
        </div>

        <hr>-->

        <div class="p-16">
          <button mat-flat-button style="background-color: #009CF4" (click)="onBack()" class="w-100 text-white">Logout</button>
        </div>

      </mat-menu>
    </div>
  </mat-toolbar>
</mat-toolbar>
<mat-sidenav-container class="sidenav-container">

  <!-- Sidebar -->
  <mat-sidenav #drawer class="sidenav" fixedInViewport [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'" >

    <div class="p-16">

      <div class="pt-8">
        <ul>
          <li class="list-group mb-2" *ngFor="let sidenav of sidebarMenu">
            <a matRipple [matRippleColor]="'#f7f8f443'" routerLink="{{ sidenav.link }}"
              class="sidebar-menu w-100 d-flex align-items-center" [routerLinkActive]="routerActive">
              <mat-icon fontIcon="{{ sidenav.icon}}" class="material-icons-outlined"></mat-icon>
              <span class="ps-4">{{ sidenav.menu }}</span>
            </a>
          </li>
        </ul>
      </div>

    </div>

  </mat-sidenav>

  <mat-sidenav-content [ngClass]=" drawer.opened ? 'opened' : 'closed'">

    <!-- Header -->


    <!-- Content -->
    <div class="body-wrapper">
      <div class="page-wrapper">
        <router-outlet class="zoom"></router-outlet>
      </div>
    </div>


  </mat-sidenav-content>

</mat-sidenav-container>
