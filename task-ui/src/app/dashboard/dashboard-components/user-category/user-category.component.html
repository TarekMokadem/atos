<!-- Daily Activity -->
<mat-card class="w-100">
    <mat-card-content>
      <h4 class="mb-56">User Categories</h4>
  
      <div class="table-responsive">
        <table mat-table [dataSource]="userCategoryList" class="text-nowrap w-100">
  
          <!-- Category Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Category Name </th>
            <td mat-cell class="fw-medium" *matCellDef="let element"> {{element.name}} </td>
          </ng-container>
  
          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let element">
              <p class="mb-0 fw-medium op-5">{{ element.description }}</p>
            </td>
          </ng-container>
  
          <!-- Count Column -->
          <ng-container matColumnDef="count">
            <th mat-header-cell *matHeaderCellDef> Count </th>
            <td mat-cell *matCellDef="let element">
              <p class="mb-0 fw-medium">{{element.count}}</p>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
