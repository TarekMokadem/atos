<mat-tab-group>
  <mat-tab label="Demandes d'accès">
    <mat-card>
      <mat-card-content>
        <button mat-icon-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
        <table mat-table [dataSource]="accessDemandeList  " matSort>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Subject</th>
            <td mat-cell *matCellDef="let element" >{{ element.description }}</td>
          </ng-container>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container> 

          <!-- CREATION DATE TODO-->

          <tr mat-header-row *matHeaderRowDef="visibleColumns" ></tr>
          <tr mat-row *matRowDef="let row; columns: visibleColumns" (click)="openPopup(row)"></tr>
        </table>

        <button mat-raised-button class="me-8 mt-16 mb-8" color="primary" routerLink="../demande-acces">Ajouter une Nouvelle Demandes d'accès</button>
        <div>
          <router-outlet></router-outlet>
          </div>
        
      </mat-card-content>
    </mat-card>
  </mat-tab>
