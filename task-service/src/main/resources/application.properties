spring.application.name=task
server.port=${PORT:8080}
# Aiven peut fournir mysql://... ; l'app préfixe automatiquement en jdbc:mysql:// (voir MysqlJdbcUrlEnvironmentPostProcessor).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Origines du frontend (séparées par des virgules). Ex. https://votre-app.pages.dev,http://localhost:4200
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Premier démarrage (base vide) : définir BOOTSTRAP_ADMIN_PASSWORD sur l'hébergeur pour créer un admin.
# Optionnel : BOOTSTRAP_ADMIN_EMAIL (défaut admin@local.dev). Retirer le mot de passe du secret après usage si tu préfères.

# Branche démo : jeux de données et comptes préremplis (désactive le bootstrap admin classique).
app.demo=true