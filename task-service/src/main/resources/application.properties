spring.application.name=task
server.port=${PORT:8080}
# Aiven peut fournir mysql://... ; l'app préfixe automatiquement en jdbc:mysql:// (voir MysqlJdbcUrlEnvironmentPostProcessor).
# Valeurs par défaut pour éviter l'échec de résolution des placeholders en CI / sans .env (voir application-test.properties pour H2).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:task}}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET:dev-only-change-in-prod-min-32-chars!!}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Répare les tables MySQL existantes dont la colonne id n'a pas AUTO_INCREMENT (erreur SQL 1364).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Origines du frontend (séparées par des virgules). Ex. https://votre-app.pages.dev,http://localhost:4200
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Premier démarrage (base vide) : définir BOOTSTRAP_ADMIN_PASSWORD sur l'hébergeur pour créer un admin.
# Optionnel : BOOTSTRAP_ADMIN_EMAIL (défaut admin@local.dev). Retirer le mot de passe du secret après usage si tu préfères.

# Branche démo : jeux de données et comptes préremplis (désactive le bootstrap admin classique).
app.demo=true

# Santé pour supervision / load-balancer (public, sans détails sensibles).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never