# NON_KEYWORDS=USER : la table JPA s'appelle "user" (mot réservé H2 sans ce paramètre).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# Écrase le dialecte MySQL du fichier principal (sinon échec du contexte avec H2)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
SECURITY_JWT_SECRET=test-secret-for-jwt-hs256-minimum-32-chars-long
app.demo=false
app.cors.allowed-origins=http://localhost:4200

management.endpoints.web.exposure.include=health
